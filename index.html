<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencarian Kampung & Sekolah Dampingan 2026</title>
<style>
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --ink: #1f2320;
    --muted: #6b6f6b;
    --accent: #2f6b45;
    --accent-soft: #e7f0ea;
    --border: #e3e1da;
    --khk-color: #7a4f2b;
    --sekolah-color: #2b5f7a;
    --sekolah-soft: #e3edf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-size: 1.35rem;
    margin: 4px 0 2px;
    font-weight: 700;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 18px;
  }
  .search-box {
    position: relative;
    margin-bottom: 8px;
  }
  .search-box input {
    width: 100%;
    padding: 13px 40px 13px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    font-size: 1rem;
    background: var(--card);
    color: var(--ink);
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    padding: 4px;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 14px 2px;
  }
  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-chip {
    padding: 6px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .filter-chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .count-row {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 4px 2px 10px;
  }
  .list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .list-row {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .list-row:last-child { border-bottom: none; }
  .row-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row-name {
    font-weight: 700;
    font-size: 0.98rem;
    color: var(--ink);
  }
  .type-tag {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .type-tag.kampung { background: var(--accent-soft); color: var(--accent); }
  .type-tag.sekolah { background: var(--sekolah-soft); color: var(--sekolah-color); }
  .row-meta {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .row-meta b { color: var(--ink); font-weight: 600; }
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty-state .icon {
    font-size: 2.2rem;
    margin-bottom: 10px;
  }
  mark {
    background: #fef08a;
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔎 Pencarian Dampingan 2026</h1>
  <div class="subtitle">Cari siapa Duta yang mendampingi kampung/sekolah tertentu, atau kampung/sekolah apa saja yang didampingi seorang Duta.</div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Ketik nama Duta, kampung, sekolah, kelurahan, atau kemantren...">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
  <div class="hint">Contoh: "Eti Pujiastuti" untuk lihat semua dampingannya, atau "Sosromenduran" untuk cari siapa Duta-nya.</div>

  <div class="filter-row">
    <button class="filter-chip active" data-filter="semua">Semua</button>
    <button class="filter-chip" data-filter="Kampung">🏘️ Kampung</button>
    <button class="filter-chip" data-filter="Sekolah">🏫 Sekolah</button>
  </div>

  <div class="count-row" id="countRow"></div>
  <div id="results"></div>
</div>

<script>
const DATA = [{"khk": "Brian Milano Sabrina", "duta": "Eti Pujiastuti", "nama": "Gemblakan Atas", "kelurahan": "Suryatmajan", "kemantren": "Danurejan", "jumlah": 10, "jenis": "Kampung"}, {"khk": "Brian Milano Sabrina", "duta": "Eti Pujiastuti", "nama": "Ledok Tukangan", "kelurahan": "Tegalpanggung", "kemantren": "Danurejan", "jumlah": 11, "jenis": "Kampung"}, {"khk": "Brian Milano Sabrina", "duta": "Eti Pujiastuti", "nama": "Tukangan", "kelurahan": "Tegalpanggung", "kemantren": "Danurejan", "jumlah": 12, "jenis": "Kampung"}, {"khk": "Brian Milano Sabrina", "duta": "Eti Pujiastuti", "nama": "Tegal Lempuyangan", "kelurahan": "Bausasran", "kemantren": "Danurejan", "jumlah": 13, "jenis": "Kampung"}, {"khk": "Brian Milano Sabrina", "duta": "Eti Pujiastuti", "nama": "Lempuyangan", "kelurahan": "Bausasran", "kemantren": "Danurejan", "jumlah": 14, "jenis": "Kampung"}, {"khk": "Brian Milano Sabrina", "duta": "Eti Pujiastuti", "nama": "Gemblakan Bawah", "kelurahan": "Suryatmajan", "kemantren": "Danurejan", "jumlah": 15, "jenis": "Kampung"}];

let activeFilter = 'semua';
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultsEl = document.getElementById('results');
const countRow = document.getElementById('countRow');
const filterChips = document.querySelectorAll('.filter-chip');

filterChips.forEach(chip => {
  chip.addEventListener('click', () => {
    filterChips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    render();
  });
});

searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  render();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  render();
  searchInput.focus();
});

function normalize(s) {
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function highlight(text, query) {
  if (!query || !text) return text;
  const idx = normalize(text).indexOf(normalize(query));
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
}

function matches(item, q) {
  if (!q) return true;
  const nq = normalize(q);
  return normalize(item.duta).includes(nq) ||
         normalize(item.nama).includes(nq) ||
         normalize(item.kelurahan).includes(nq) ||
         normalize(item.kemantren).includes(nq) ||
         normalize(item.khk).includes(nq);
}

function render() {
  const q = searchInput.value.trim();
  let list = DATA.filter(item => matches(item, q));
  if (activeFilter !== 'semua') {
    list = list.filter(item => item.jenis === activeFilter);
  }

  if (list.length === 0) {
    countRow.textContent = '';
    resultsEl.innerHTML = `<div class="empty-state"><div class="icon">🗂️</div>Tidak ada hasil untuk "${q}".<br>Coba kata kunci lain.</div>`;
    return;
  }

  countRow.textContent = q
    ? `${list.length} hasil ditemukan`
    : `Menampilkan semua ${list.length} data dampingan`;

  let html = '<div class="list">';
  list.forEach(item => {
    const tagClass = item.jenis === 'Kampung' ? 'kampung' : 'sekolah';
    const tagIcon = item.jenis === 'Kampung' ? '🏘️' : '🏫';
    html += `
      <div class="list-row">
        <div class="row-top">
          <span class="type-tag ${tagClass}">${tagIcon} ${item.jenis}</span>
          <span class="row-name">${highlight(item.nama, q)}</span>
        </div>
        <div class="row-meta">
          👤 <b>${highlight(item.duta, q)}</b> &nbsp;·&nbsp; KHK: ${highlight(item.khk || '-', q)} &nbsp;·&nbsp; 📍 ${highlight(item.kelurahan || '-', q)}, ${highlight(item.kemantren || '-', q)}
        </div>
      </div>`;
  });
  html += '</div>';

  resultsEl.innerHTML = html;
}

render();
</script>
</body>
</html>
